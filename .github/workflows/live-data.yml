# Collects open data every 5 minutes and publishes it to the "data" branch (one commit, force-pushed).
# The site reads https://raw.githubusercontent.com/ArmaniMachinena/worldnow-web/data/*.json
# Every source is refreshed at least every 2 hours (fast ones every 5–30 minutes).
# GitHub's own schedule is unreliable (runs every 4–8 hours since mid-November), so each run keeps
# collecting for ~115 minutes and then starts the next run itself (relay). The 2-hour schedule stays
# as a backup that restarts the chain if it ever breaks. Public repository: Actions minutes are free.
name: live-data
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: collector
      - name: Previous data
        run: |
          git clone --quiet --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" prev || mkdir -p prev
          mkdir -p out && cp prev/*.json out/ 2>/dev/null || true
      - name: Python packages
        run: pip install --quiet h3 || true
      - name: Collect and publish every 5 minutes
        env:
          OPENSKY_ID: ${{ secrets.OPENSKY_ID }}
          OPENSKY_SECRET: ${{ secrets.OPENSKY_SECRET }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        run: |
          start=$(date +%s)
          while :; do
            t0=$(date +%s)
            python3 src/collector/collect.py prev out || true
            rm -rf pub && mkdir pub && cp out/*.json pub/
            (cd pub && git init --quiet -b data && git add -A \
              && git -c user.name="worldnow-bot" -c user.email="worldnow-bot@users.noreply.github.com" commit --quiet -m "data $(date -u +%FT%TZ)" \
              && git push --quiet --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" data) || echo "push failed"
            rm -rf prev && cp -r out prev
            now=$(date +%s)
            [ $((now - start)) -gt 6900 ] && break
            sleep $(( 300 - (now - t0) > 10 ? 300 - (now - t0) : 10 ))
          done
      - name: Start the next run (relay, keeps the 2-hour cycle going)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-data.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "relay failed; the schedule restarts the chain"
