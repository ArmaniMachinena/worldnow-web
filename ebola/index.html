 <p><b>2. Вывоз за рубеж.</b> Ожидаемое число вывозов = новые случаи × вывозов на 1000 случаев. Калибровка: за 11,4 тыс. случаев нынешней вспышки было 4 вывоза (Уганда, Кения, Франция, Нигерия) ≈ 0,35 на 1000 при нынешних мерах; в 2014 году — около дюжины вывозов на 28,6 тыс. случаев (≈0,4 на 1000). Без мер принято ≈1 на 1000 (в 3 раза больше), при жёстких мерах ≈0,15. Вывозы распределяются по странам по весам поездок (соседи по суше, затем авиасвязь).</p>

 why: ['Ebola spreads through the blood and body fluids of a sick person, not through the air. People are hardly contagious before symptoms, and with symptoms they are usually too ill to travel.',
  'So even without measures, R outside the outbreak in countries with decent hospitals is below 1: single cases and short chains are possible, a large epidemic is unlikely.',

 how: `<p><b>1. Epidemic in DR Congo.</b> About 450 new cases a week now. Every ${GEN_DAYS} days (the serial interval) cases multiply by R; growth is capped by the people the virus can realistically reach (ceiling ${(CAP / 1e6).toFixed(0)} million).</p>

    .on('mousemove', (e, d) => { const x = by[+d.id]; if (!x && +d.id !== 180) { tip.style.display = 'none'; return; }
      tip.innerHTML = +d.id === 180 ? `<b>${lang === 'ru' ? 'ДР Конго' : 'DR Congo'}</b><br>${fmt(NOW.drc)} ${T('n_cases')}` : `<b>${name(x.c)}</b><br>${T('th_imp')}: ${pct(x.imp)}<br>${T('th_loc')}: ${pct(x.loc)}<br>${T('th_sus')}: ${pct(x.sus)}`;
      tip.style.display = 'block'; tip.style.left = Math.min(innerWidth - 270, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; })
    .on('mouseleave', () => { tip.style.display = 'none'; });
}
document.addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) { scn = b.dataset.s; Object.assign(par, SCN[scn]); render(); }
  const l = e.target.closest('[data-l]'); if (l) { lang = l.dataset.l; try { localStorage.setItem('wn_lang', lang); } catch (err) {} render(); } });
for (const [id, k] of [['R', 'R'], ['E', 'E'], ['L', 'L'], ['H', 'H']]) document.getElementById('i' + id).addEventListener('input', e => { par[k] = +e.target.value; render(); });
render();
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r => r.json()).then(t => { world = topojson.feature(t, t.objects.countries).features; render(); }).catch(() => {});
</script>
