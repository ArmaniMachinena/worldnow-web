button{font:inherit}

.kick{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.45fr 1fr}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}

.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:700px){.sc{grid-template-columns:1fr}}
.sc button{text-align:left;padding:10px 12px;font-size:14px;line-height:1.3}.sc button small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.ctl{display:grid;grid-template-columns:170px 1fr;gap:10px 12px;align-items:center;font-size:13.5px;margin-top:12px}

.ctl input[type=range]{width:100%;accent-color:var(--gold)}
.big{font-family:var(--mono);font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1}
.note{font-size:12.5px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:700;padding:6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid #1c2029;vertical-align:middle}td.n{font-family:var(--mono);text-align:right;white-space:nowrap}

#map{width:100%;height:auto;display:block;border-radius:8px;background:#0e1219}
.legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);flex-wrap:wrap;margin-top:8px}.legend i{display:inline-block;width:22px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
.scr{overflow-x:auto}

ol.src{font-size:12.5px;color:var(--dim);padding-left:20px}ol.src li{margin:3px 0}

</head>
